spring:
  datasource:
    url: jdbc:mysql://${DEV_DB_HOST:${DB_HOST:127.0.0.1}}:${DEV_DB_PORT:${DB_PORT:3306}}/ledger_pro?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DEV_DB_USERNAME:${DB_USERNAME:root}}
    password: ${DEV_DB_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    username: ${MAIL_USERNAME:test@test.com}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail.smtp.from: ${MAIL_FROM:test@test.com}
  data:
    redis:
      host: ${DEV_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${DEV_REDIS_PORT:${REDIS_PORT:6379}}

app:
  jwt:
    secret: ${JWT_SECRET:test-jwt-secret-for-testing-only-32byte}

logging:
  level:
    com.example.back_end: DEBUG
