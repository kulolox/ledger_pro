spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ledger_pro?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    username: ${MAIL_USERNAME:test@test.com}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail.smtp.from: ${MAIL_FROM:test@test.com}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:test-jwt-secret-for-testing-only-32byte}

logging:
  level:
    com.example.back_end: DEBUG
