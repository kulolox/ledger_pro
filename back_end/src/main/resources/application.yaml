spring:
  application:
    name: back_end
  datasource:
    # 配置 H2 为内存模式（mem:testdb），应用重启后数据会自动清空，非常适合测试
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 123456  # 你可以自定义一个密码，方便后面登录控制台
  jpa:
    hibernate:
      ddl-auto: update  # 自动根据你的实体类（Entity）创建或更新数据库表结构
    show-sql: true      # 在控制台打印执行的 SQL 语句，方便调试
    database-platform: org.hibernate.dialect.H2Dialect # 指定 H2 的数据库方言
  h2:
    console:
      # 开启 H2 数据库的网页控制台
      enabled: true
      path: /h2-console # 控制台的访问路径