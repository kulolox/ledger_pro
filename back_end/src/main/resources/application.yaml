spring:
  application:
    name: back_end
  datasource:
    url: jdbc:mysql://localhost:3306/ledger_pro?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ledger-pro-jwt-secret-key-2026-must-be-32bytes

server:
  port: 8080
  servlet:
    context-path: /api/v1 # 接口的全局通用前缀