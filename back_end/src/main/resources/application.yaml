spring:
  application:
    name: back_end
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:back_end/.env[.properties]
      - optional:file:.env.local[.properties]
      - optional:file:back_end/.env.local[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl # SQL 走 slf4j，级别由下方 logging 控制，生产默认不打印 SQL
  global-config:
    db-config:
      logic-delete-field: deleted # 逻辑删除字段名
      logic-delete-value: 1 # 已删除的值
      logic-not-delete-value: 0 # 未删除的值

app:
  jwt:
    secret: ${JWT_SECRET:}
  update:
    latest-version: ${APP_UPDATE_LATEST_VERSION:1.0.1}
    version-code: ${APP_UPDATE_VERSION_CODE:101}
    min-version: ${APP_UPDATE_MIN_VERSION:1.0.0}
    changelog: ${APP_UPDATE_CHANGELOG:1. 修复已知异常，提升系统性能}
    download-url: ${APP_UPDATE_DOWNLOAD_URL:/api/v1/system/version/download}
    package-size: ${APP_UPDATE_PACKAGE_SIZE:}
    force-update: ${APP_UPDATE_FORCE_UPDATE:false}

logging:
  level:
    com.example.back_end: info
    com.example.back_end.mapper: warn # 需要调试 SQL 时改为 debug

server:
  servlet:
    context-path: /api/v1
    encoding:
      charset: UTF-8
      enabled: true
      force: true
